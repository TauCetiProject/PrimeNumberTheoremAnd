name: Build Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering of the workflow from the GitHub Actions interface

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

permissions:
  contents: read

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Free space for Mathlib and Tau Ceti artifacts
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true # saves approximately 12 GB
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Install Lean and restore Mathlib
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          use-github-cache: false
          build: false
          test: false
          lint: false

      - name: Install cache tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/pnt-cache-tools"
          "$RUNNER_TEMP/pnt-cache-tools/bin/python" -m pip install uv==0.13.5
          echo "$RUNNER_TEMP/pnt-cache-tools/bin" >> "$GITHUB_PATH"

      - name: Restore Tau Ceti artifacts
        run: bash .lake/packages/TauCeti/scripts/lake-cache-get.sh .lake/packages/TauCeti

      - name: Check every retained Lean module
        run: lake build

      - name: Check blueprint metadata
        run: lake build :blueprint

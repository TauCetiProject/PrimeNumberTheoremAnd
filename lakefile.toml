name = "PrimeNumberTheoremAnd"
defaultTargets = ["PrimeNumberTheoremAnd"]
allowNonModules = true

[leanOptions]
pp.unicode.fun = true
pp.proofs.withType = false
autoImplicit = false
relaxedAutoImplicit = false
warn.sorry = false
linter.mathlibStandardSet = true
linter.style.header = false
linter.style.openClassical = false
linter.style.longLine = false
linter.style.emptyLine = false
linter.flexible = true

[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect.git"
rev = "v4.36.0-rc2"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "e8ba86fa9744dd8d90f48c1752bc735f61a4ca81"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti.git"
rev = "1564f8beacbdce7f3eb7e700557b29824345db0b"

[[lean_lib]]
name = "PrimeNumberTheoremAnd"
globs = ["PrimeNumberTheoremAnd.*"]
